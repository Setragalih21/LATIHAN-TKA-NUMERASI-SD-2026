<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TKA Literasi SD 2026</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 500px;
    }
    h2, h3 { text-align: center; color: #333; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
    input[type="text"], select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover { background-color: #45a049; }
    .option-btn {
      background-color: #e7e7e7;
      color: #333;
      margin-bottom: 10px;
      text-align: left;
    }
    .option-btn:hover { background-color: #ddd; }
    #quiz-section, #result-section { display: none; }
    .status-msg { text-align: center; font-style: italic; color: #666; margin-top: 15px; }
  </style>
</head>
<body>

<div class="container">
  <h2>TKA Literasi SD 2026</h2>

  <!-- Identitas Siswa -->
  <div id="login-section">
    <h3>Masukkan Identitas</h3>
    <div class="form-group">
      <label for="nama">Nama Lengkap:</label>
      <input type="text" id="nama" placeholder="Contoh: Budi Santoso" required>
    </div>
    <div class="form-group">
      <label for="kelas">Kelas:</label>
      <select id="kelas">
        <option value="Kelas 5A">Kelas 5A</option>
        <option value="Kelas 5B">Kelas 5B</option>
        <option value="Kelas 6A">Kelas 6A</option>
        <option value="Kelas 6B">Kelas 6B</option>
      </select>
    </div>
    <button onclick="mulaiKuis()">Mulai Kerjakan</button>
  </div>

  <!-- Area Kuis -->
  <div id="quiz-section">
    <h3 id="question-text">Soal akan muncul di sini</h3>
    <div id="options-container"></div>
  </div>

  <!-- Area Hasil -->
  <div id="result-section">
    <h3>Kuis Selesai!</h3>
    <p id="score-text" style="font-size: 20px; text-align: center; font-weight: bold;"></p>
    <div id="status-msg" class="status-msg">Mengirim skor ke Google Sheets...</div>
  </div>
</div>

<script>
  // URL Web App milikmu
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzjSpo6OYPP5a7v7bOaU4LUn1PqOKAiGVBmnuX1TREADDDsaW6FsCJdRx-vEGvkRHKJ0Q/exec";

  let studentData = { nama: "", kelas: "" };
  let currentQuestionIndex = 0;
  let score = 0;

  // Daftar Soal Kuis (Bisa kamu tambah/ubah sesuai kebutuhan)
  const questions = [
    {
      question: "Apa tujuan utama dari membaca teks petunjuk?",
      options: [
        "A. Untuk mengetahui langkah-langkah melakukan sesuatu",
        "B. Untuk menghibur pembaca",
        "C. Untuk menceritakan pengalamannya",
        "D. Untuk menjual barang"
      ],
      answer: 0
    },
    {
      question: "Persamaan kata dari 'Giat' adalah...",
      options: [
        "A. Malas",
        "B. Rajin",
        "C. Santai",
        "D. Lambat"
      ],
      answer: 1
    }
  ];

  function mulaiKuis() {
    const namaInput = document.getElementById("nama").value.trim();
    if (!namaInput) {
      alert("Harap masukkan nama kamu terlebih dahulu!");
      return;
    }
    studentData.nama = namaInput;
    studentData.kelas = document.getElementById("kelas").value;

    document.getElementById("login-section").style.display = "none";
    document.getElementById("quiz-section").style.display = "block";
    tampilkanSoal();
  }

  function tampilkanSoal() {
    if (currentQuestionIndex >= questions.length) {
      selesaiKuis();
      return;
    }

    const q = questions[currentQuestionIndex];
    document.getElementById("question-text").innerText = `Soal ${currentQuestionIndex + 1}: ${q.question}`;
    
    const optionsDiv = document.getElementById("options-container");
    optionsDiv.innerHTML = "";

    q.options.forEach((opt, idx) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerText = opt;
      btn.onclick = () => pilihJawaban(idx);
      optionsDiv.appendChild(btn);
    });
  }

  function pilihJawaban(indexJawaban) {
    if (indexJawaban === questions[currentQuestionIndex].answer) {
      score += 50; // Skor per soal (karena 2 soal, total 100)
    }
    currentQuestionIndex++;
    tampilkanSoal();
  }

  function selesaiKuis() {
    document.getElementById("quiz-section").style.display = "none";
    document.getElementById("result-section").style.display = "block";
    document.getElementById("score-text").innerText = `Nilai Kamu: ${score}`;

    // Kirim data ke Google Sheets
    kirimKeGoogleSheets();
  }

  function kirimKeGoogleSheets() {
    const payload = {
      nama: studentData.nama,
      kelas: studentData.kelas,
      skor: score
    };

    fetch(WEB_APP_URL, {
      method: "POST",
      mode: "no-cors", // Diperlukan untuk Google Apps Script
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
    .then(() => {
      document.getElementById("status-msg").innerText = "✅ Skor berhasil tersimpan di Google Sheets!";
      document.getElementById("status-msg").style.color = "green";
    })
    .catch(err => {
      console.error(err);
      document.getElementById("status-msg").innerText = "⚠️ Gagal menyimpan skor. Coba periksa koneksi.";
      document.getElementById("status-msg").style.color = "red";
    });
  }
</script>

</body>
</html>
